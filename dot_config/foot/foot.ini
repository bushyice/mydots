# Mirrors dot_config/ghostty/config

# Font Configuration
font=monospace:size=12

# Window Configuration
pad=16x12
include=~/.local/share/foot/themes/catppuccin

# Transparency (needs a compositing WM)
[colors-dark]
alpha=0.8
blur=no

# Cursor Configuration
[cursor]
style=block
blink=yes
unfocused-style=hollow

# Scrollback
[scrollback]
lines=5025

# Terminal features
[mouse]
hide-when-typing=no
